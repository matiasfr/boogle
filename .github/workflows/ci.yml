name: CI

# Runs on PRs, on main, and on the ship/* branches `npm run ship` pushes (their checks count as the PR's required
# checks: same commit). automerge.yml dispatches it on main after each merge, since a bot merge doesn't fire push.
on:
  pull_request:
  push:
    branches: [main, 'ship/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REF: ${{ github.ref_name }}
        run: |
          # A ship is the entire delta from main, including its first push (before is zero).
          # Never classify only an autofix's last docs commit while earlier code is still unmerged.
          if [[ "$REF" == ship/* ]] || { [ "$EVENT" = workflow_dispatch ] && [ "$REF" != main ]; }; then
            BASE=$(git merge-base origin/main HEAD)
          fi
          # Main dispatches conservatively run all gates.
          if { [ "$EVENT" = workflow_dispatch ] && [ "$REF" = main ]; } || [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            echo 'heavy=true' >> "$GITHUB_OUTPUT"
          else
            git diff --no-renames --name-only -z "$BASE" HEAD > /tmp/changed-files
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = fs.readFileSync('/tmp/changed-files', 'utf8').split('\0').filter(Boolean);
          const docs = files.length > 0 && files.every(f => f.startsWith('docs/') || f.startsWith('.claude/') || f.endsWith('.md'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `heavy=${!docs}\n`);
          NODE
          fi
  client:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Lint (Oxlint, type-aware rules and Boogle protections)
        run: npm run lint
      - run: npm run typecheck
      # Reads committed files only: needs neither Blender nor KTX-Software.
      - run: npm run assets -- --check
      # format:check is not enforced: the repo is Prettier-clean and Claude Code's hook formats each edited file,
      # but a red main for whitespace isn't worth it yet.
      - run: npm run build
      - run: npm run test:unit
      # Current shared names (presence keys, message types, pad slots, frame orders) and debt ratchets against main.
      # On main the checkout's origin/main is this commit, so there's nothing to compare, and fetching a main that has
      # moved on since the checkout is a rejected non-fast-forward: a red run in every burst of merges.
      - if: github.ref != 'refs/heads/main'
        run: git fetch -q --depth=1 origin main:refs/remotes/origin/main
      - run: npm run registry
      - run: npm run level-check

  server:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build the image (from the repo root, as the deploy does)
        working-directory: .
        run: docker build -f server/Dockerfile .

  net:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium and system deps
        run: npx playwright install --with-deps chromium
      - run: npm run test:net

  # Single-player browser scenarios only, one leg each so the slowest sets the wall time. Two tabs drawing in the
  # runner's software WebGPU (SwiftShader) run at a few frames a second and time out at random, so SCENARIO_GATE=pr
  # makes run.ts refuse a second player. Multiplayer is covered here by test:net (real rooms, no rendering) and the
  # replay unit test; rendered `smoke` runs daily against the live site on the Mac GPU and optionally before ship
  # (`--gpu`). Post-deploy smoke.yml is browserless. Other scenarios run nightly on the owner Mac. A flaky leg
  # here gets a better wait (on a condition, not a time), never a skip; one that can't be reliable here moves to the
  # device gate or the nightly list.
  scenarios:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    # One scenario today: keep its required-check name explicit even when the job is skipped.
    name: scenario world-inputs
    runs-on: ubuntu-latest
    # Browsers and system libraries are baked in: no apt install/upgrade or service restarts per run.
    # Keep this tag and the version assertion below aligned with the installed Playwright package.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Check Playwright matches the container
        run: >-
          node -e "require('node:assert/strict').equal(require('playwright/package.json').version,
          '1.64.1', 'Update the scenario container tag and version assertion when upgrading Playwright')"
      - run: npm run scenario -- world-inputs
        env:
          SCENARIO_GATE: pr # one player only; run.ts refuses a second tab
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-world-inputs
          path: .look/scenarios/world-inputs/
          include-hidden-files: true # .look/ is a dot directory
          if-no-files-found: ignore
