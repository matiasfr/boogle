name: CI

# Runs on PRs, on main, and on the ship/* branches `npm run ship` pushes (their checks count as the PR's required
# checks: same commit). automerge.yml dispatches it on main after each merge, since a bot merge doesn't fire push.
# A ship/* PR's own pull_request runs do nothing: the push run is the one automerge counts (owner call "Fast ships").
# Docs-only changes (dev/ci/change-class.ts) run only the docs job; code runs lint, build, unit and registry, and server
# and net when their import closure changed (always on main).
on:
  pull_request:
  push:
    branches: [main, 'ship/**']
  workflow_dispatch:

permissions:
  contents: read

# A newer run cancels an older one in its group, queued or running, on a PR and on main: main's runs (one dispatched
# per merge) only need a verdict on the newest commit, and older ones held runners from ship branches. A ship/** push
# run is never cancelled: automerge.yml merges on that exact run. Deploys and the smoke are other workflows with their
# own groups and are never cancelled by this.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

jobs:
  changes:
    # GitHub has no head-branch filter for pull_request, so a ship PR's run starts and skips every job here. The bot's
    # own PR events (opening it) still show as "action_required": GitHub holds those for approval; nothing needs them.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'ship/')
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
      docs: ${{ steps.diff.outputs.docs }}
      server: ${{ steps.diff.outputs.server }}
      image: ${{ steps.diff.outputs.image }}
      net: ${{ steps.diff.outputs.net }}
      unit_full: ${{ steps.diff.outputs.unit_full }}
      unit_shards: ${{ steps.diff.outputs.unit_shards }}
      unit_only: ${{ steps.diff.outputs.unit_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REF: ${{ github.ref_name }}
        run: |
          # A ship is the entire delta from main, including its first push (before is zero).
          # Never classify only an autofix's last docs commit while earlier code is still unmerged.
          if [[ "$REF" == ship/* ]] || { [ "$EVENT" = workflow_dispatch ] && [ "$REF" != main ]; }; then
            BASE=$(git merge-base origin/main HEAD)
          fi
          # Empty/unknown diffs and main (dispatch or push) run every gate: an empty list to --jobs means everything.
          # Otherwise server and net run when their import closure changed, the image build and boot when its paths
          # did (dev/ci/change-class.ts).
          # The unit run: the full suite in four shards, or (dev/ci/unit-select.ts) the affected tests plus the core in
          # one job for a ship that touches neither lockstep nor a review path. Main and an empty diff are full.
          if [ "$REF" = main ] || [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            jobs=$(node dev/ci/change-class.ts --jobs < /dev/null)
            unit=$(node dev/ci/unit-select.ts < /dev/null)
          else
            # Both sides of a rename: moving a file out of docs is a code change.
            git diff --no-renames --name-only -z "$BASE" HEAD > "$RUNNER_TEMP/changed"
            jobs=$(node dev/ci/change-class.ts --jobs < "$RUNNER_TEMP/changed")
            unit=$(node dev/ci/unit-select.ts < "$RUNNER_TEMP/changed")
          fi
          echo "$jobs"
          echo "$unit"
          { echo "$jobs"; echo "$unit"; } >> "$GITHUB_OUTPUT"

  # Docs-only: the checks prose can break. Must-read and launch budgets, task routes and rules frontmatter (registry)
  # and the agent definitions' model frontmatter. Nothing a docs path holds is built, bundled or tested otherwise.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - if: github.ref != 'refs/heads/main'
        run: git fetch -q --depth=1 origin main:refs/remotes/origin/main
      - run: npm run registry
      - run: node --test test/models.test.ts test/change-class.test.ts

  # The client gate, as four parallel jobs sharing the npm cache: wall time is the slowest, not the sum.
  lint:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Lint (Oxlint, type-aware rules and Boogle protections)
        run: npm run lint
      - run: npm run typecheck
      # format:check is not enforced: the repo is Prettier-clean and Claude Code's hook formats each edited file,
      # but a red main for whitespace isn't worth it yet.

  build:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build

  # The unit tests. The full suite (main, and any ship that touches lockstep code, a review path or something every
  # test shares: dev/ci/unit-select.ts) runs in four parallel shards (node --test-shard: every fourth file), with the rail
  # audit and every tick offset of the sweeps (`--ci`, dev/test-env.ts). Any other ship runs one job: the tests that
  # import a changed file plus the core, the audit on, every 16th offset and one fuzz seed (`--ship`); main proves the
  # rest minutes after the merge (docs/agents/ship-pipeline.md, "Unit test settings"; docs/plans/ci-diet.md, Batch 2).
  unit:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.unit_shards) }}
    # The whole suite took 16 minutes in one job on 11 November (world v27's Ring Island fuzz tests took it past 10, so
    # main's run was cancelled twice). Cut the suite or add a shard before raising this.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Unit tests (the full suite in four shards, or the ship's selection in one)
        env:
          FULL: ${{ needs.changes.outputs.unit_full }}
          UNIT_ONLY: ${{ needs.changes.outputs.unit_only }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          if [ "$FULL" = true ]; then
            npm run test:unit -- --ci --test-shard="$SHARD/$SHARDS"
          else
            npm run test:unit -- --ship
          fi

  registry:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Current shared names (presence keys, message types, pad slots, frame orders) and debt ratchets against main.
      # On main the checkout's origin/main is this commit, so there's nothing to compare, and fetching a main that has
      # moved on since the checkout is a rejected non-fast-forward: a red run in every burst of merges.
      - if: github.ref != 'refs/heads/main'
        run: git fetch -q --depth=1 origin main:refs/remotes/origin/main
      - run: npm run registry
      - run: npm run level-check
      # Reads committed files only: needs neither Blender nor KTX-Software.
      - run: npm run assets -- --check

  # Only when the server tests' import closure changed; the image build and boot only when the image's paths did
  # (dev/ci/change-class.ts). Skipped, the job reports success. Main always runs both.
  server:
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && (needs.changes.outputs.server == 'true' || needs.changes.outputs.image == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - if: needs.changes.outputs.server == 'true'
        run: npm ci
      - if: needs.changes.outputs.server == 'true'
        run: npm test
      - name: Build the image (from the repo root, as the deploy does)
        if: needs.changes.outputs.image == 'true'
        working-directory: .
        run: docker build -f server/Dockerfile --build-arg BOOGLE_BUILD=ci-boot -t boogle-server:ci .
      # Tests run from the full checkout; this runs what the image carries (a missing module crash-looped Fly once).
      - name: Boot the image
        if: needs.changes.outputs.image == 'true'
        working-directory: .
        run: scripts/server-boot-check.sh boogle-server:ci ci-boot

  # Only when the import closure of dev/peer-test changed (dev/ci/change-class.ts); main always runs it.
  net:
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && needs.changes.outputs.net == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        # No --with-deps: its apt step stalled 605 s in 16 of 73 net jobs on 11 November. The runner image already
        # carries the libraries headless Chromium needs; if it ever does not, test:net fails loudly at launch.
        run: npx playwright install chromium
      - run: npm run test:net

  # A red main is loud (owner call "Fast ships": one green run merges, so main's own CI is the combination check).
  # ci-autofix.yml also has Claude open a claude/fix-main-* PR; this keeps one open `red-main` issue (GitHub notifies
  # the owner) and closes it when main is green again. `npm run heartbeat` leads with the same verdict.
  red-main:
    needs: [changes, docs, lint, build, unit, registry, server, net]
    # Not in a cancelled (superseded) run: the newer run on main settles the verdict, so a cancelled one never opens,
    # comments on or closes the issue, even if a job had failed before it was cancelled.
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && github.repository == 'matiasfr/boogle'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RED: ${{ contains(needs.*.result, 'failure') }}
      GREEN: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    steps:
      - run: |
          run="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          num=$(gh issue list --label red-main --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ "$RED" = true ]; then
            gh label create red-main --color b60205 --description 'CI is failing on main' 2>/dev/null || true
            body="CI failed on main at $GITHUB_SHA: $run. ci-autofix.yml has Claude open a claude/fix-main-* PR; fixing main beats starting something new."
            if [ -n "$num" ]; then
              gh issue comment "$num" --body "$body"
            else
              gh issue create --title 'Main is red' --label red-main --body "$body"
            fi
          elif [ "$GREEN" = true ] && [ -n "$num" ]; then
            gh issue close "$num" --comment "Green again at $GITHUB_SHA: $run"
          fi

  # Rendered scenarios (world-inputs included) run daily on the owner's Mac, not software WebGPU CI.
  # CI retains headless test:net and replay units; post-deploy Smoke is browserless.
