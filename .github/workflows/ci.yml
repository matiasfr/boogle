name: CI

# Runs on PRs, on main, and on the ship/* branches `npm run ship` pushes (their checks count as the PR's required
# checks: same commit). automerge.yml dispatches it on main after each merge that changes code, since a bot merge
# doesn't fire push; a docs-only merge gets main-docs.yml, which comes back here on any doubt.
# A ship/* PR's own pull_request runs do nothing: the push run is the one automerge counts (owner call "Fast ships").
# Docs-only changes (dev/ci/change-class.ts) run only the docs job; code runs lint, build, unit and registry, server
# and net when their import closure changed and image when the server image's paths did (on main: since its last green run; all three once a day).
on:
  pull_request:
  push:
    branches: [main, 'ship/**']
  workflow_dispatch:
    inputs:
      full:
        description: On main, run server, image and net whatever changed since the last green run
        type: boolean
        default: false
  # Once a day every job runs on main whatever changed: the backstop for a load no import walk follows, now that
  # main's other runs scope server, image and net (the changes job). Its own group, so merges neither cancel it nor
  # are cancelled by it.
  schedule:
    - cron: '47 9 * * *'

permissions:
  contents: read

# A newer run cancels an older one in its group, queued or running, on a PR and on main: main's runs (one dispatched
# per merge) only need a verdict on the newest commit, and older ones held runners from ship branches. A ship/** push
# run is never cancelled: automerge.yml merges on that exact run. Deploys and the smoke are other workflows with their
# own groups and are never cancelled by this.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'schedule' && '-daily' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name != 'schedule') }}

jobs:
  changes:
    # GitHub has no head-branch filter for pull_request, so a ship PR's run starts and skips every job here. The bot's
    # own PR events (opening it) still show as "action_required": GitHub holds those for approval; nothing needs them.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'ship/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # main's last verdict, for the scope below
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
      docs: ${{ steps.diff.outputs.docs }}
      server: ${{ steps.diff.outputs.server }}
      image: ${{ steps.diff.outputs.image }}
      net: ${{ steps.diff.outputs.net }}
      unit_full: ${{ steps.diff.outputs.unit_full }}
      unit_shards: ${{ steps.diff.outputs.unit_shards }}
      unit_only: ${{ steps.diff.outputs.unit_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REF: ${{ github.ref_name }}
          FULL: ${{ inputs.full }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A ship is the entire delta from main, including its first push (before is zero).
          # Never classify only an autofix's last docs commit while earlier code is still unmerged.
          if [[ "$REF" == ship/* ]] || { [ "$EVENT" = workflow_dispatch ] && [ "$REF" != main ]; }; then
            BASE=$(git merge-base origin/main HEAD)
          fi
          # Empty/unknown diffs run every gate: an empty list to --jobs means everything. Otherwise server and net run
          # when their import closure changed, the image build and boot when its paths did (dev/ci/change-class.ts).
          # Main (owner, 18 November: "go ahead with scope server") scopes those three the same way, by everything
          # that changed since main's last verdict, when that verdict is green: a green run at a commit means its
          # whole tree passed, so a job whose closure has not changed since would say what it said then. Lint, build,
          # the full unit suite and registry still run for any code change. Every job runs when the last verdict is
          # red or unreadable, when that commit is not an ancestor, when nothing changed (a rerun), on the daily
          # schedule and on a dispatch with `full`.
          # The unit run: the full suite in eight balanced shards, or (dev/ci/unit-select.ts) the affected tests plus the core in
          # one job for a ship that touches neither lockstep nor a review path. Main and an empty diff are full.
          if [ "$REF" = main ] || [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            jobs=$(node dev/ci/change-class.ts --jobs < /dev/null)
            unit=$(node dev/ci/unit-select.ts < /dev/null)
            if [ "$REF" = main ] && [ "$EVENT" != schedule ] && [ "$FULL" != true ]; then
              # The newest finished run that gave a verdict (a cancelled one was superseded), as dev/heartbeat.sh.
              last=$(gh run list --workflow ci.yml --branch main --status completed --limit 20 --json conclusion,headSha \
                --jq '[.[] | select(.conclusion != "cancelled" and .conclusion != "skipped")][0] // empty | "\(.conclusion) \(.headSha)"') || last=
              green=${last#success }
              if [[ "$last" == "success "* ]] && git merge-base --is-ancestor "$green" HEAD &&
                 git diff --no-renames --name-only -z "$green" HEAD > "$RUNNER_TEMP/changed" && [ -s "$RUNNER_TEMP/changed" ]; then
                echo "Main was green at $green: server, image and net by what changed since."
                jobs=$(node dev/ci/change-class.ts --jobs < "$RUNNER_TEMP/changed")
              else
                echo "No green verdict to build on (${last:-none}): every job."
              fi
            fi
          else
            # Both sides of a rename: moving a file out of docs is a code change.
            git diff --no-renames --name-only -z "$BASE" HEAD > "$RUNNER_TEMP/changed"
            jobs=$(node dev/ci/change-class.ts --jobs < "$RUNNER_TEMP/changed")
            unit=$(node dev/ci/unit-select.ts < "$RUNNER_TEMP/changed")
          fi
          echo "$jobs"
          echo "$unit"
          { echo "$jobs"; echo "$unit"; } >> "$GITHUB_OUTPUT"

  # Docs-only: the checks prose can break. Must-read and launch budgets, task routes and rules frontmatter (registry)
  # and the agent definitions' model frontmatter. Nothing a docs path holds is built, bundled or tested otherwise.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - if: github.ref != 'refs/heads/main'
        run: git fetch -q --depth=1 origin main:refs/remotes/origin/main
      - run: npm run registry
      - run: node --test test/models.test.ts test/change-class.test.ts

  # The client gate, as four parallel jobs sharing the npm cache: wall time is the slowest, not the sum.
  lint:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Lint (Oxlint, type-aware rules and Boogle protections)
        run: npm run lint
      - run: npm run typecheck
      # format:check is not enforced: the repo is Prettier-clean and Claude Code's hook formats each edited file,
      # but a red main for whitespace isn't worth it yet.

  build:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build

  # The unit tests. The full suite (main, and any ship that touches lockstep code, a review path or something every
  # test shares: dev/ci/unit-select.ts) runs in eight parallel shards, balanced by measured whole-file duration
  # (dev/ci/unit-shards.ts; test-unit.ts consumes --test-shard before Node), with the rail
  # audit and every tick offset of the sweeps (`--ci`, dev/test-env.ts). Any other ship runs one job: the tests that
  # import a changed file plus the core, the audit on, every 16th offset and one fuzz seed (`--ship`); main proves the
  # rest minutes after the merge (docs/agents/ship-pipeline.md, "Unit test settings"; docs/plans/ci-diet.md, Batch 2).
  unit:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.unit_shards) }}
    # Three file workers per shard. Each file gets its own 8 min process-group deadline from its start.
    # The 10 min limit below covers setup and all waves of files. The runner warns after 7 min per shard.
    # Re-measure/rebalance before raising this; see docs/research/ci-unit-shard-time.md. Audit/sweeps stay full.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Unit tests (the full suite in eight balanced shards, or the ship's selection in one)
        env:
          FULL: ${{ needs.changes.outputs.unit_full }}
          UNIT_ONLY: ${{ needs.changes.outputs.unit_only }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          if [ "$FULL" = true ]; then
            npm run test:unit -- --ci --test-shard="$SHARD/$SHARDS"
          else
            npm run test:unit -- --ship
          fi

  registry:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Current shared names (presence keys, message types, pad slots, frame orders) and debt ratchets against main.
      # On main the checkout's origin/main is this commit, so there's nothing to compare, and fetching a main that has
      # moved on since the checkout is a rejected non-fast-forward: a red run in every burst of merges.
      - if: github.ref != 'refs/heads/main'
        run: git fetch -q --depth=1 origin main:refs/remotes/origin/main
      - run: npm run registry
      - run: npm run level-check
      # Reads committed files only: needs neither Blender nor KTX-Software.
      - run: npm run assets -- --check

  # Only when the server tests' import closure changed (dev/ci/change-class.ts; on main, since its last green run).
  # Skipped, the job reports success. Its own job, beside `image`: in one job the two took 7 to 12 minutes in a row and were the last to
  # finish in 53 of 63 green main runs (12 to 18 November), 100 s after the slowest unit shard.
  server:
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    # The audited tests take 4 to 5.5 min. A timed-out job is "cancelled", which red-main and the heartbeat read as
    # superseded (17 November, twice, when this job also built the image inside 10 minutes).
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          RAIL_AUDIT: '1' # the rail audit on, as the unit job's --ci (test/helpers/rail-no-audit.ts)

  # The server image, built and booted: only when the image's paths changed (dev/ci/change-class.ts), as `server`.
  # Docker is on the runner and the image installs its own packages, so no Node setup or npm ci here.
  image:
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # the build is 4 to 4.5 min, most of it the rail-save seeding
    steps:
      - uses: actions/checkout@v7
      - name: Build the image (from the repo root, as the deploy does)
        run: docker build -f server/Dockerfile --build-arg BOOGLE_BUILD=ci-boot -t boogle-server:ci .
      # Tests run from the full checkout; this runs what the image carries (a missing module crash-looped Fly once).
      - name: Boot the image
        run: scripts/server-boot-check.sh boogle-server:ci ci-boot

  # Only when the import closure of dev/peer-test changed (dev/ci/change-class.ts), as `server`.
  net:
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && needs.changes.outputs.net == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        # No --with-deps: its apt step stalled 605 s in 16 of 73 net jobs on 11 November. The runner image already
        # carries the libraries headless Chromium needs; if it ever does not, test:net fails loudly at launch.
        run: npx playwright install chromium
      - run: npm run test:net

  # A red main is loud (owner call "Fast ships": one green run merges, so main's own CI is the combination check).
  # ci-autofix.yml also has Claude open a claude/fix-main-* PR; this keeps one open `red-main` issue (GitHub notifies
  # the owner) and closes it when main is green again. `npm run heartbeat` leads with the same verdict.
  red-main:
    needs: [changes, docs, lint, build, unit, registry, server, image, net]
    # Not in a cancelled (superseded) run: the newer run on main settles the verdict, so a cancelled one never opens,
    # comments on or closes the issue, even if a job had failed before it was cancelled.
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && github.repository == 'matiasfr/boogle'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RED: ${{ contains(needs.*.result, 'failure') }}
      # The daily run may open the issue but never closes it: it judges the commit it started on, and a newer run on a
      # newer commit may have gone red while it ran.
      GREEN: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name != 'schedule' }}
    steps:
      - run: |
          run="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          num=$(gh issue list --label red-main --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ "$RED" = true ]; then
            gh label create red-main --color b60205 --description 'CI is failing on main' 2>/dev/null || true
            body="CI failed on main at $GITHUB_SHA: $run. ci-autofix.yml has Claude open a claude/fix-main-* PR; fixing main beats starting something new."
            if [ -n "$num" ]; then
              gh issue comment "$num" --body "$body"
            else
              gh issue create --title 'Main is red' --label red-main --body "$body"
            fi
          elif [ "$GREEN" = true ] && [ -n "$num" ]; then
            gh issue close "$num" --comment "Green again at $GITHUB_SHA: $run"
          fi

  # Rendered scenarios (world-inputs included) run daily on the owner's Mac, not software WebGPU CI.
  # CI retains headless test:net and replay units; post-deploy Smoke is browserless.
