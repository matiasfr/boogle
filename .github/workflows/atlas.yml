name: Atlas citation report

# Narrative upkeep runs on the owner's Mac: npm run daily -- atlas (dev/daily/README.md).
# The advisory CI report, on command (gh workflow run atlas.yml); automerge.yml no longer dispatches it per merge.
# No model or write credentials.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/atlas/**'
      - 'src/world/rules/**'
      - 'src/net/**'
      - 'src/netplay/**'
      - 'server/**'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Report stale citations (advisory)
        run: npm run atlas -- --check >> "$GITHUB_STEP_SUMMARY"
