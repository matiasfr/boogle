name: Nightly simplify

# Once a day (and on demand), Claude reviews recently changed code for cleanups: reuse, simplification,
# efficiency, dead code. It opens a small claude/ PR that automerge.yml merges when CI is green.
# Behavior must not change. It skips days with no new commits and never stacks PRs.

on:
  schedule:
    - cron: '17 11 * * *' # ~4am Pacific, when nobody is pushing
  workflow_dispatch:
    inputs:
      days:
        description: 'Look at code changed in the last N days'
        default: '2'

concurrency:
  group: simplify
  cancel-in-progress: false

jobs:
  simplify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DAYS: ${{ inputs.days || '2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
      - name: Anything to do?
        id: gate
        run: |
          open=$(gh pr list --state open --search 'head:claude/simplify' --json number --jq 'length')
          changed=$(git log --since="$DAYS days ago" --name-only --pretty=format: -- src server/src | sort -u | grep -E '\.(js|mjs)$' | grep -v '^$' || true)
          if [ "$open" != "0" ] || [ -z "$changed" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "Skipping (open simplify PR: $open; changed files: none?)"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
            { echo 'files<<EOF'; echo "$changed"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip == '0'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.skip == '0'
      - uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.skip == '0'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Read,Edit,Write,Grep,Glob,Bash(git *),Bash(gh pr create:*),Bash(gh pr list:*),Bash(npm run *),Bash(npm ci)"'
          prompt: |
            You are the nightly cleanup pass for this repo. Follow CLAUDE.md, AGENTS.md and DESIGN.md.
            Review these files changed in the last ${{ env.DAYS }} days (and their direct callers if needed):
            ${{ steps.gate.outputs.files }}

            Look for: duplicated logic that should reuse an existing helper, dead or unused code and exports,
            needless complexity, obvious inefficiencies in per-frame code (allocations in hot loops, repeated work),
            stale comments, and leftovers from cut features (the old crop/garden sim, keepy-uppy streak; the mushroom stall
            in src/mushroom-garden.js is current, keep it).
            Rules:
            - No behavior or gameplay changes, no tuning changes, no new features, no new dependencies.
            - Don't touch determinism-sensitive logic (src/sim/, src/world/*-logic.js, src/world/sync.js) unless the change
              is provably identical in result; never change wire formats or serialized state.
            - No formatting-only churn. Keep the diff small and focused (aim for under ~300 changed lines);
              if you find more, do the most valuable part and list the rest in the PR body.
            - Run `npm run check` (and `npm run test:net` if you touched src/net*). If anything fails, fix or drop that change.
            If nothing is worth changing, stop without opening a PR.
            Otherwise commit to a new branch `claude/simplify-${{ github.run_id }}` and open a PR titled
            "Simplify: <summary>" with a bullet list of each change and why it's safe. It is squash-merged automatically
            when CI passes.
