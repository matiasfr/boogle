name: Deploy server to Fly.io

# Tests server/ and deploys it to Fly.io when it changes on main (or by hand). Without a FLY_API_TOKEN secret the
# deploy job is skipped, not failed, so forks and friends without Fly stay green. Setup: server/README.md.
# automerge.yml dispatches this for merged PRs that touch server/ (GITHUB_TOKEN merges don't fire push).

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/world/**'
      - 'src/sim/**'
      - 'src/ecs/**'
      - 'src/math-pure.ts'
      - 'src/math.ts'
      - 'src/place/town-plan.ts'
      - 'src/place/home-station.ts'
      - 'src/place/rotunda.ts'
      - 'src/net/ids.ts'
      - 'src/net/ws-wire.ts'
      - 'src/net/account-wire.ts'
      - 'src/net/rtc-wire.ts'
      - 'package.json'
      - '.dockerignore'
      - '.github/workflows/deploy-server.yml'
      - 'dev/server-build.ts'
      - 'dev/ci/docs-path.ts'
      - '!**/*.md'
      - 'server/test/**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # Tests plus the image build take 6 to 10 minutes; 10 cancelled two deploys on 16 November.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    outputs:
      deploy: ${{ steps.token.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      # CI's server and image jobs already ran the server tests and built and booted this image on the ship branch; a
      # merge with the same source tree skips repeating them (owner, 24 November: a server merge went live in about 19
      # minutes, 11 of them a rerun). Any doubt (no run found, a different tree, a job not green) runs them as before.
      - name: Find a green CI run on this tree
        id: green
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tree=$(git rev-parse HEAD^{tree})
          found=false
          for row in $(gh api "repos/$REPO/actions/workflows/ci.yml/runs?status=success&per_page=30" --jq '.workflow_runs[] | "\(.id):\(.head_sha)"'); do
            id=${row%%:*}; sha=${row#*:}
            [ "$(gh api "repos/$REPO/git/commits/$sha" --jq .tree.sha 2>/dev/null)" = "$tree" ] || continue
            ok=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | select((.name == "server" or .name == "image") and .conclusion == "success")] | length')
            if [ "$ok" = "2" ]; then
              echo "::notice::CI run $id passed the server and image jobs on commit $sha with this tree; skipping the rerun."
              found=true
              break
            fi
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.green.outputs.found != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        if: steps.green.outputs.found != 'true'
      - run: npm test
        if: steps.green.outputs.found != 'true'
        env:
          RAIL_AUDIT: '1'
      - name: Build the image (from the repo root)
        if: steps.green.outputs.found != 'true'
        working-directory: .
        run: docker build -f server/Dockerfile --build-arg BOOGLE_BUILD=ci-boot -t boogle-server:ci .
      # Runs what the image carries before the deploy job replaces the machine (a missing module crash-looped Fly once).
      - name: Boot the image
        if: steps.green.outputs.found != 'true'
        working-directory: .
        run: scripts/server-boot-check.sh boogle-server:ci ci-boot
      - name: Check for FLY_API_TOKEN
        id: token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No FLY_API_TOKEN secret; skipping the server deploy (see server/README.md)."
          fi

  deploy:
    needs: test
    if: needs.test.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # flyctl's remote build and rollout took 10 to 14 minutes on 25 and 26 November; 15 cancelled one at its last line.
    timeout-minutes: 25
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Identify the server source commit
        id: build
        run: echo "sha=$(node --input-type=module -e 'import { serverBuild } from "./dev/server-build.ts"; console.log(serverBuild())')" >> "$GITHUB_OUTPUT"
      # The app is the FLY_APP repo variable if set, else `app` in fly.toml.
      - name: Pick the app
        id: app
        env:
          FLY_APP: ${{ vars.FLY_APP }}
        run: echo "name=${FLY_APP:-$(sed -n 's/^app *= *"\(.*\)".*/\1/p' server/fly.toml)}" >> "$GITHUB_OUTPUT"
      # One machine: the volume is per machine and signaling state lives in memory. Built from the repo root: the
      # image carries src/world, src/sim and the shared net modules (server/Dockerfile).
      - run: flyctl deploy . --config server/fly.toml --dockerfile server/Dockerfile --remote-only --ha=false --app "$APP" --build-arg "BOOGLE_BUILD=$BUILD"
        env:
          APP: ${{ steps.app.outputs.name }}
          BUILD: ${{ steps.build.outputs.sha }}
      - name: Wait for /healthz
        env:
          APP: ${{ steps.app.outputs.name }}
        run: |
          url="https://$APP.fly.dev/healthz"
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "$url" | grep -qx ok; then
              echo "Healthy: $url"
              exit 0
            fi
            echo "Attempt $i: not healthy yet"
            sleep 6
          done
          echo "::error::$url did not answer ok within two minutes"
          exit 1
