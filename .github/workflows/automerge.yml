name: Auto-merge

# Merges green work into main, then deploys. Two ways in:
# - `npm run ship` pushes a ship/<name>-<sha> branch and CI runs on that push. This opens its PR (red or green, so
#   ci-autofix.yml and people have somewhere to look) and, when green, merges it with a merge commit: the shipper's
#   local commits stay exactly what main has, so their next ship rebases cleanly.
# - A PR from any other branch in this repo (claude/* from Claude, a friend's feature branch): squash-merged when CI
#   on it is green.
# Opt out per PR with the `no-automerge` label, or by leaving it as a draft.
# A PR that conflicts with main is handed to ci-autofix.yml, which merges main into the branch.
# Merges made with GITHUB_TOKEN don't trigger push workflows, so this also starts the deploys and CI on main.
# Opening PRs needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

# One group per branch: GitHub keeps only one *pending* run per group and cancels the rest, so a single shared group
# silently dropped ships when many landed at once (1 Nov 2026: 13 green ship branches never got a PR). Merges into main
# still serialize on GitHub's side, and a branch that falls behind is handed to ci-autofix.yml as before.
concurrency:
  group: automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    # A ship/* push after its PR opens runs CI twice (push and pull_request); only the push run counts.
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'main' &&
      (
        ((github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.conclusion == 'success' &&
         !startsWith(github.event.workflow_run.head_branch, 'ship/')) ||
        ((github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && startsWith(github.event.workflow_run.head_branch, 'ship/'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN: ${{ github.event.workflow_run.id }}
      GREEN: ${{ github.event.workflow_run.conclusion == 'success' }}
      SHIPPER: ${{ github.event.workflow_run.actor.login }}
      # GitHub logins excluded from the friends report.
      OWNERS: matiasfr
    steps:
      - name: Find or open the PR
        id: pr
        run: |
          current=$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH" --jq .object.sha)
          if [ "$current" != "$SHA" ]; then
            echo 'Superseded CI head; do not open a PR or delete its ref.'
            exit 0
          fi
          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')
          if [ -z "$pr" ] && [[ "$BRANCH" == ship/* ]]; then
            commits=$(gh api "repos/$GH_REPO/compare/main...$SHA" --jq '.commits')
            n=$(jq length <<<"$commits")
            if [ "$n" = 0 ]; then
              # Do not delete a ref here: it could advance between comparison and deletion.
              echo "Everything at $SHA is already on main; nothing to merge."
              exit 0
            fi
            title=$(jq -r '.[-1].commit.message | split("\n")[0]' <<<"$commits")
            [ "$n" -gt 1 ] && title="$title (+$((n - 1)) more)"
            # The shipper's login is kept out of sight (no @, so no notification); ci-autofix.yml mentions them if
            # it gives up.
            body=$(jq -r --arg who "$SHIPPER" '
              "Shipped with `npm run ship`; merges itself when CI is green.\n\n"
              + (map("### " + .commit.message) | join("\n\n"))
              + "\n\n<!-- shipper: " + $who + " -->"' <<<"$commits")
            pr=$(gh api "repos/$GH_REPO/pulls" -f head="$BRANCH" -f base=main -f title="$title" -f body="$body" \
              --jq .number) || {
              echo "::error::Couldn't open a PR for $BRANCH. Is 'Allow GitHub Actions to create and approve pull requests' on?"
              exit 1
            }
            echo "Opened #$pr for $BRANCH."
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Merge
        id: merge
        if: steps.pr.outputs.number != '' && env.GREEN == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          # Optional hardening only: 404 (no protection) and 403 (unreadable) must not stop ships.
          if protection=$(gh api "repos/$GH_REPO/branches/main/protection" 2>/dev/null) &&
             jq -e '.required_status_checks.strict == true' <<<"$protection" >/dev/null; then
            echo 'Strict up-to-date checks are enabled; GitHub also guards the final merge race.'
          else
            echo '::notice::Strict branch protection is absent or unreadable. A seconds-wide race remains between the ancestry check and merge; CI runs on main after every merge to detect a bad combination.'
          fi
          refresh() {
            gh api -X PUT "repos/$GH_REPO/pulls/$PR/update-branch" -f expected_head_sha="$SHA"
            # update-branch is asynchronous (202); dispatch only after its new ref exists.
            for _ in $(seq 1 12); do
              tip=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
              if [ "$tip" != "$SHA" ]; then
                before=$(gh run list --workflow ci.yml --branch "$BRANCH" --commit "$tip" --event workflow_dispatch \
                  --json databaseId --jq 'map(.databaseId) | max // 0')
                gh workflow run ci.yml --ref "$BRANCH"
                # Own the continuation: never depend on a token-dispatched run emitting workflow_run.
                # Include queue time in the deadline. A different/newer head cannot authorize this merge.
                deadline=$((SECONDS + 1800))
                while [ "$SECONDS" -lt "$deadline" ]; do
                  current=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
                  [ "$current" = "$tip" ] || { echo 'Head superseded while waiting for CI.'; return 1; }
                  run=$(gh run list --workflow ci.yml --branch "$BRANCH" --commit "$tip" --event workflow_dispatch \
                    --json databaseId,status,conclusion --jq "[.[] | select(.databaseId > $before)] | max_by(.databaseId) // empty")
                  if [ -n "$run" ] && [ "$(jq -r .status <<<"$run")" = completed ]; then
                    [ "$(jq -r .conclusion <<<"$run")" = success ] || { echo '::error::Refreshed CI did not succeed.'; return 1; }
                    SHA=$tip
                    CI_RUN=$(jq -r .databaseId <<<"$run")
                    return 0
                  fi
                  sleep 10
                done
                echo '::error::Timed out waiting for refreshed CI; inspect the PR and rerun CI.'
                return 1
              fi
              sleep 2
            done
            echo '::error::Branch update did not become visible; rerun CI after inspecting the PR.'
            return 1
          }
          # Re-enter all guards after every refresh or failed merge, including opt-outs and CI reruns.
          for try in 1 2 3 4 5; do
            # GitHub works out mergeability in the background; UNKNOWN means not yet.
            for _ in 1 2 3 4 5 6; do
              info=$(gh pr view "$PR" --json state,isDraft,isCrossRepository,baseRefName,headRefName,headRefOid,labels,mergeable,title)
              [ "$(jq -r .mergeable <<<"$info")" != UNKNOWN ] && break
              sleep 5
            done
            if [ "$(jq -r '.state != "OPEN" or .isDraft or .isCrossRepository or .baseRefName != "main" or .headRefName != env.BRANCH or .headRefOid != env.SHA or ([.labels[].name] | index("no-automerge") != null)' <<<"$info")" = true ]; then
              echo "#$PR is closed, ineligible, opted out, or has moved past $SHA; skipping."
              exit 0
            fi
            # Reject a superseded run (even if it was green) or a queued/failed/cancelled rerun.
            runs=$(gh run list --workflow ci.yml --branch "$BRANCH" --commit "$SHA" --limit 100 \
              --json databaseId,event,status,conclusion)
            latest=$(jq -c '[.[] | select(.event == "workflow_dispatch" or
              (if (env.BRANCH | startswith("ship/")) then .event == "push" else .event == "pull_request" end))]
              | max_by(.databaseId) // empty' <<<"$runs")
            if [ -z "$latest" ] || [ "$(jq -r '.databaseId | tostring' <<<"$latest")" != "$CI_RUN" ] ||
               [ "$(jq -r '.status == "completed" and .conclusion == "success"' <<<"$latest")" != true ]; then
              echo 'CI is superseded or no longer successful; skipping.'
              exit 0
            fi
            if [ "$(jq -r .mergeable <<<"$info")" = CONFLICTING ]; then
              echo "#$PR conflicts with main; asking ci-autofix.yml to merge main into $BRANCH."
              gh workflow run ci-autofix.yml --ref main -f branch="$BRANCH" -f reason=conflict
              exit 0
            fi
            main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
            relation=$(gh api "repos/$GH_REPO/compare/$main...$SHA" --jq .status)
            if [ "$relation" != ahead ] && [ "$relation" != identical ]; then
              # Merge latest main into this branch, preserving ship commit ancestry. The token's
              # update does not trigger push CI, so dispatch and await CI on the NEW head.
              refresh
              echo 'Main moved: refreshed CI passed; rechecking current PR and main.'
              continue
            fi
            # Two merges landing together fail one with "Base branch was modified".
            if [[ "$BRANCH" == ship/* ]]; then
              gh pr merge "$PR" --merge --subject "$(jq -r .title <<<"$info") (#$PR)" --delete-branch --match-head-commit "$SHA" && break
            else
              gh pr merge "$PR" --squash --delete-branch --match-head-commit "$SHA" && break
            fi
            # Main may have moved during merge. Never retry with stale green evidence;
            # update the branch, await its CI, then re-enter every guard in this job.
            main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
            relation=$(gh api "repos/$GH_REPO/compare/$main...$SHA" --jq .status)
            if [ "$relation" != ahead ] && [ "$relation" != identical ]; then
              refresh
              continue
            fi
            [ "$try" != 5 ] || exit 1
            sleep $((try * 10))
          done
          # Exhausting the refresh budget is not a successful merge.
          [ "$(gh pr view "$PR" --json state --jq .state)" = MERGED ] || exit 1
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Deploy, and run CI on main
        if: steps.merge.outputs.merged == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh workflow run deploy.yml --ref main
          gh workflow run ci.yml --ref main
          if gh pr diff "$PR" --name-only | grep -qE '^(server/|src/world/|src/sim/|src/ecs/|src/net/ids\.ts|src/net/ws-wire\.ts|package\.json|\.dockerignore|\.github/workflows/deploy-server\.yml)'; then
            gh workflow run deploy-server.yml --ref main
          fi
          # The atlas upkeep's gate (atlas.yml) decides whether a merge matters; this only wakes it. A GITHUB_TOKEN
          # merge never fires its push trigger. Atlas PRs themselves don't wake it.
          if [[ "$BRANCH" != claude/atlas-* ]]; then
            gh workflow run atlas.yml --ref main
          fi

      # Opening a ship PR starts a pull_request CI run, and merging it seconds later deletes the ref that run needs, so
      # it fails with "workflow file issue" and leaves a red X on a change that merged. The push run already covered
      # this commit; delete the leftover.
      - name: Delete the ship PR's leftover CI run
        if: steps.merge.outputs.merged == 'true' && startsWith(env.BRANCH, 'ship/')
        run: |
          sleep 15 # let the run fail first; GitHub won't delete one in progress
          gh run list --workflow ci.yml --branch "$BRANCH" --event pull_request --json databaseId --jq '.[].databaseId' |
            while read -r id; do gh run delete "$id" || true; done

      # main just moved: close ship PRs it already contains, and hand PRs it now conflicts with to ci-autofix.yml
      # (a PR in conflict gets no pull_request CI, so nothing else would wake it).
      - name: Tidy the other open PRs
        if: steps.merge.outputs.merged == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          sleep 10 # let GitHub recompute mergeability against the new main
          gh pr list --state open --json number,headRefName,headRefOid,isDraft,isCrossRepository \
            --jq '.[] | select((.isDraft or .isCrossRepository) | not)
                      | select(.headRefName | startswith("ship/") or startswith("claude/"))
                      | "\(.number) \(.headRefName) \(.headRefOid)"' |
            while read -r num ref sha; do
              if [[ "$ref" == ship/* ]] && [ "$(gh api "repos/$GH_REPO/compare/main...$sha" --jq .ahead_by)" = 0 ]; then
                # Preserve the ref: it can advance after this comparison. A new head can reopen a PR.
                gh pr close "$num" --comment "The compared head $sha is already on main (it went in with #$PR). Branch retained in case it advanced."
              elif [ "$(gh pr view "$num" --json mergeable --jq .mergeable)" = CONFLICTING ]; then
                echo "#$num now conflicts with main; asking ci-autofix.yml to merge main into $ref."
                gh workflow run ci-autofix.yml --ref main -f branch="$ref" -f reason=conflict
              fi
            done
