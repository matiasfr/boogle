name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history, without the file contents: the atlas page shows the commit count (dev/atlas/extract.ts);
      # without history it hides.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run lint
      - run: npm run build
        env:
          BASE: /
          VITE_BOOGLE_SERVER: ${{ vars.VITE_BOOGLE_SERVER }}
          VITE_BUILD: ${{ github.sha }}
      # Recent builds' hashed files stay published for pages still loading them. Never blocks a game deploy.
      - run: node scripts/keep-old-assets.ts dist || true
        env:
          SITE_URL: https://boogle.club/
      # Share pages for patch videos (video-* releases, dev/video/site.ts). Never blocks a game deploy.
      - run: node dev/video/site.ts dist || true
        env:
          SITE_URL: https://boogle.club/
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Check the live site with what just went out (smoke.yml says why this is a dispatch). Needs deploy, so a failed
  # deploy starts nothing. In a burst of merges GitHub keeps only the newest waiting run of the smoke group.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run smoke.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
