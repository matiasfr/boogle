name: Smoke

# Two-player check of the live site, after every deploy and nightly (dev/scenarios/smoke.ts): two headless tabs join room smoke-<UTC weekday
# 1-7>, see each other, toss an item, throw the ball and compare per-state world hashes. Seven rooms in rotation keep
# nightly runs from filling the server's MAX_ROOMS, and a reused room also loads its stored snapshot. On failure (or timeout)
# it opens, or comments on, the one open issue labelled 'smoke', with the failing checks and a link to the run
# (screenshots are its artifact).

on:
  schedule:
    - cron: '37 9 * * *' # daily, 09:37 UTC
  # deploy.yml dispatches this after each deploy of main, so a build that breaks the live site (WebGPU on a real CDN,
  # the Fly server) is caught within minutes instead of the next morning. Not workflow_run: it never fired here, probably
  # GitHub's three-level limit on those chains (CI, then automerge.yml, then the deploy it dispatches).
  workflow_dispatch:
    inputs:
      url:
        description: Game URL to test
        default: https://boogle.club/

permissions:
  contents: read
  issues: write

concurrency:
  # Per ref: a manual run on a branch must not be replaced by (or replace) the run that a deploy of main queues.
  group: smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live:
    # Forks have no live site of their own here.
    if: github.repository == 'matiasfr/boogle'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      URL: ${{ inputs.url || 'https://boogle.club/' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium and system deps
        run: npx playwright install --with-deps chromium
      - name: Two players on the live site
        shell: bash # -o pipefail, so tee keeps the scenario's exit code
        run: SMOKE_ROOM="smoke-$(date -u +%u)" npm run scenario -- smoke --url "$URL" 2>&1 | tee smoke.log
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: |
            .look/scenarios/smoke/
            smoke.log
          include-hidden-files: true # .look/ is a dot directory
          if-no-files-found: ignore
      - name: Open or update the smoke issue
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create smoke --color d93f0b --description 'Nightly live smoke test' 2>/dev/null || true
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fails=$(grep -E 'FAIL|threw|page error' smoke.log 2>/dev/null | head -20 || true)
          body=$(printf 'The live smoke test failed or timed out against %s (%s).\n\n```\n%s\n```\n\nScreenshots: the smoke-screenshots artifact of that run.' \
            "$URL" "$run" "${fails:-no scenario output; see the run log}")
          num=$(gh issue list --label smoke --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            # This runs after every deploy, so a lasting failure would comment on each one: every 6 hours is enough.
            last=$(gh issue view "$num" --json comments,createdAt --jq '.comments[-1].createdAt // .createdAt')
            if [ $(($(date -u +%s) - $(date -u -d "$last" +%s))) -gt 21600 ]; then
              gh issue comment "$num" --body "$body"
            fi
          else
            gh issue create --title 'Nightly smoke test is failing' --label smoke --body "$body"
          fi
