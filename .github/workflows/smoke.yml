name: Smoke

# Browserless deployment/asset/room check, then one headless page load of the game's boot (no play). Two-player rendered
# smoke runs only on the owner's Mac daily.

on:
  schedule:
    - cron: '37 9 * * *' # daily, 09:37 UTC
  # deploy.yml dispatches this after each deploy of main, so a build that breaks the live site (WebGPU on a real CDN,
  # the Fly server) is caught within minutes instead of the next morning. Not workflow_run: it never fired here, probably
  # GitHub's three-level limit on those chains (CI, then automerge.yml, then the deploy it dispatches).
  workflow_dispatch:
    inputs:
      url:
        description: Game URL to test
        default: https://boogle.club/
      build:
        description: Expected Pages commit (deploy passes its SHA; scheduled runs check live consistency)
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  # Per ref: a manual run on a branch must not be replaced by (or replace) the run that a deploy of main queues.
  group: smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live:
    # Forks have no live site of their own here.
    if: github.repository == 'matiasfr/boogle'
    runs-on: ubuntu-latest
    # live-smoke.ts waits up to 5 minutes for deploy-server (7-minute hard deadline); the boot check adds an install
    # and up to 2.5 minutes of page load.
    timeout-minutes: 15
    env:
      URL: ${{ inputs.url || 'https://boogle.club/' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm --prefix server ci --omit=dev --no-audit --no-fund
      - name: Assets, deployment identity and live room round-trip
        shell: bash # -o pipefail, so tee keeps the scenario's exit code
        env:
          BUILD: ${{ inputs.build }}
        run: |
          args=(--url "$URL")
          [ -z "$BUILD" ] || args+=(--build "$BUILD")
          node dev/live-smoke.ts "${args[@]}" 2>&1 | tee smoke.log
      # The game's own boot, in one headless page (dev/live-boot.ts): fails on a startup throw such as v27's railway
      # mount, which showed the no-WebGPU lobby and passed the checks above. If SwiftShader's WebGPU does not start on
      # the runner it warns "unproven" and passes.
      - if: ${{ !cancelled() }}
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - id: pw
        if: ${{ !cancelled() }}
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium and system deps
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium
      - name: The deployed game boots
        if: ${{ !cancelled() }}
        shell: bash
        run: node dev/live-boot.ts --url "$URL" 2>&1 | tee -a smoke.log
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-log
          path: smoke.log
          if-no-files-found: ignore
      - name: Open or update the smoke issue
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create smoke --color d93f0b --description 'Nightly live smoke test' 2>/dev/null || true
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fails=$(grep -E 'FAIL|threw|page error' smoke.log 2>/dev/null | head -20 || true)
          body=$(printf 'The live smoke test failed or timed out against %s (%s).\n\n```\n%s\n```\n\nDetails: the smoke-log artifact of that run.' \
            "$URL" "$run" "${fails:-no scenario output; see the run log}")
          num=$(gh issue list --label smoke --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            # This runs after every deploy, so a lasting failure would comment on each one: every 6 hours is enough.
            last=$(gh issue view "$num" --json comments,createdAt --jq '.comments[-1].createdAt // .createdAt')
            if [ $(($(date -u +%s) - $(date -u -d "$last" +%s))) -gt 21600 ]; then
              gh issue comment "$num" --body "$body"
            fi
          else
            gh issue create --title 'Nightly smoke test is failing' --label smoke --body "$body"
          fi
