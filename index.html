<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Boogle</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Lilita+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="view" tabindex="0" aria-label="Boogle island, 3D view"></canvas>

    <div class="hud">
      <div class="hud-tl">
        <div class="brand">Boogle</div>
        <ul class="roster" id="roster"></ul>
      </div>
      <div class="hud-tr">
        <span class="net" id="net" data-state="connecting"
          ><span class="net-dot"></span><span id="net-label">Connecting</span></span
        >
      </div>
      <div class="reticle" id="reticle"></div>
      <div class="charge" id="charge"><div class="charge-fill" id="charge-fill"></div></div>
      <div class="hint" id="hint" hidden></div>
    </div>

    <div class="touch" id="touch">
      <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
      <button class="tbtn jump" id="btn-jump" type="button">Jump</button>
      <button class="tbtn grab" id="btn-grab" type="button">Grab</button>
    </div>

    <div class="lobby" id="lobby">
      <form class="card" id="join" autocomplete="off">
        <h1>B<span class="o">oo</span>gle</h1>
        <p class="sub" id="lobby-sub">
          One island, one beach ball, and everyone who has this page open. Pick a name and jump in.
        </p>
        <div class="field">
          <label for="name-input">Your name</label>
          <input id="name-input" name="name" maxlength="16" placeholder="Dat Frinco" spellcheck="false" />
        </div>
        <div class="field">
          <span class="label" id="color-label">Color</span>
          <div class="swatches" id="swatches" role="radiogroup" aria-labelledby="color-label"></div>
        </div>
        <button class="enter" id="enter" type="submit" disabled>Loading island</button>
        <p class="here" id="here">Looking for friends on the island</p>
      </form>
    </div>

    <script type="module" src="/src/boot/index.ts"></script>
  </body>
</html>
