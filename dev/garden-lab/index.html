<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garden lab</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 16px; background: #f4ead2; color: #3b2f1e; }
      #bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
      button { padding: 4px 8px; border: 1px solid #a58b5a; background: #fff8e6; border-radius: 4px; cursor: pointer; }
      button.on { background: #e8b84a; }
      #grid { display: grid; grid-template-columns: repeat(12, 56px); gap: 2px; width: max-content; user-select: none; }
      .cell { width: 56px; height: 56px; background: #e9d29a; position: relative; text-align: center; font-size: 28px; line-height: 40px; border-radius: 4px; cursor: pointer; }
      .cell.wet { background: #9c7a46; box-shadow: inset 0 0 0 2px #4a90c8; }
      .cell.sel { outline: 3px solid #d33; }
      .cell small { position: absolute; left: 0; right: 0; bottom: 2px; font-size: 11px; line-height: 12px; }
      .cell i { position: absolute; top: 1px; right: 3px; font-style: normal; font-size: 12px; }
      #status { margin-top: 8px; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <h3>Garden lab</h3>
    <div id="bar"></div>
    <div id="grid"></div>
    <div id="status"></div>
    <p>
      Click: plant selected kind as current player, and select the cell. Keys 1-6: switch player. W: water selected crop as
      current player. H: harvest. Right-click: toggle wet soil (blue border).
    </p>
    <script type="module" src="./main.js"></script>
  </body>
</html>
