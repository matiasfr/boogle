# Replace the app name (must be globally unique): fly launch --no-deploy --copy-config --name <yours>
app = "boogle-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "9000"
  DATA_DIR = "/data"
  # Set to your site origin(s), comma-separated, e.g. https://you.github.io
  ALLOWED_ORIGINS = "*"

[[mounts]]
  source = "boogle_data"
  destination = "/data"

[http_service]
  internal_port = 9000
  force_https = true
  auto_stop_machines = "off"   # keep signaling sockets alive
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
