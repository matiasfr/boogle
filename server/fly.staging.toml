# STAGING for the shared-cpu-1x throttling check (docs/plans/replication.md). Never the production app: boogle-server.
# Deploy from the repo root: flyctl deploy . -c server/fly.staging.toml --dockerfile server/Dockerfile -a boogle-server-staging
# Restart after `fly scale count 0`: fly scale count 1 -a boogle-server-staging  (or fly machine start <id>).
app = "boogle-server-staging"
kill_signal = "SIGTERM"
kill_timeout = 10
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "9000"
  DATA_DIR = "/data"
  SERVER_ROOMS = "*"
  NODE_OPTIONS = "--max-old-space-size=384"

[[mounts]]
  source = "boogle_staging_data"
  destination = "/data"

[http_service]
  internal_port = 9000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
